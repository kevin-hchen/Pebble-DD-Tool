# Streamlit settings for MedRAG.

[browser]
# Off by default here. This tool is used to look at live deals, and the names of
# assets under diligence should not be leaving the machine as telemetry.
gatherUsageStats = false

[server]
# Nothing here is written for a shared deployment: no auth, no multi-user
# separation. Binding to localhost keeps it on the one machine it was built for.
address = "localhost"
headless = false

[client]
# Errors surface in the app with a plain-language message and a foldable
# "Technical details" box, rather than a raw traceback in the page body.
showErrorDetails = false

[theme]
# NOT the source of truth. theme.py is, and it restates every one of these on the
# widget itself with !important — because a theme that lives only here is one bad
# launch away from Streamlit resolving its dark widget set (label #FAFAFA, input
# fill #262730, primary #FF4B4B) against a page whose background is pinned white
# in CSS. That combination is what made labels invisible and inputs near-black.
# These values are kept only so the first paint is not a flash of the wrong
# theme, and they must be edited together with the palette in theme.py.
base = "light"
primaryColor = "#163A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EDE6DA"
textColor = "#14181F"
