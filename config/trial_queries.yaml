# Registry query sets for trial ingest.
#
# EDIT THIS FILE, NOT CODE. These are clinical judgements about how a disease is
# named in the registry, and they belong to whoever knows the field. Nothing here
# is generated by a model at query time: a synonym list that changes run to run
# makes two ingests incomparable, and an unreviewed synonym silently widens the
# population a memo is built on.
#
# Each set is fetched by running EVERY query in it and unioning the results by
# NCT ID. Each trial records which queries found it, so "did we search for colon
# cancer?" has an answer in the data rather than in someone's memory.
#
# Two kinds of query, because they reach different trials:
#
#   conditions:  query.cond — the registry's indexed condition field. This is
#                already MeSH-expanded on the server: query.cond="colorectal
#                cancer" returns records whose stated condition is "Colorectal
#                Neoplasms" or "Colon Cancer". Measured 2026-08-03, the six
#                condition phrasings below return 7,057-10,336 studies each and
#                agree on every non-basket trial we test against, so the union
#                buys little over any one of them. It is kept anyway as cheap
#                insurance: the cost is seconds, and the failure it guards
#                against is silent.
#
#   terms:       query.term — full text, including the detailed description and
#                arm labels. This is the ONLY axis that reaches basket trials.
#                NCT05405595 registers its condition as "Advanced/Metastatic
#                Solid Tumors" and says "with a focus on MSS CRC" only in its
#                detailed description; it is absent from all six condition
#                queries and is found by query.term="MSS colorectal" at rank 166
#                of 391. See the coverage note in trials/queries.py.
#
# Adding a query is safe — the union dedupes and the marginal-yield report will
# tell you whether it found anything new. If a new synonym adds zero trials,
# that is a measurement that the set is near-complete, and worth keeping.

sets:
  colorectal:
    label: Colorectal cancer
    conditions:
      - colorectal cancer
      - colorectal neoplasms
      - colon cancer
      - rectal cancer
      - bowel cancer
      - CRC
    terms:
      # Reaches solid-tumour basket trials that enrol CRC cohorts but never
      # register a colorectal condition. Narrow by construction (a few hundred
      # studies), so the false-positive cost is small and visible.
      - MSS colorectal
      - microsatellite stable colorectal
      - colorectal cohort
