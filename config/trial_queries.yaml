# Registry query sets for trial ingest.
#
# EDIT THIS FILE, NOT CODE. These are clinical judgements about how a disease is
# named in the registry, and they belong to whoever knows the field. Nothing here
# is generated by a model at query time: a synonym list that changes run to run
# makes two ingests incomparable, and an unreviewed synonym silently widens the
# population a memo is built on.
#
# Each set is fetched by running EVERY query in it and unioning the results by
# NCT ID. Each trial records which queries found it, so "did we search for colon
# cancer?" has an answer in the data rather than in someone's memory.
#
# Two kinds of query, because they reach different trials:
#
#   conditions:  query.cond — the registry's indexed condition field. This is
#                already MeSH-expanded on the server: query.cond="colorectal
#                cancer" returns records whose stated condition is "Colorectal
#                Neoplasms" or "Colon Cancer". Measured 2026-08-03, the six
#                condition phrasings below return 7,057-10,336 studies each and
#                agree on every non-basket trial we test against, so the union
#                buys little over any one of them. It is kept anyway as cheap
#                insurance: the cost is seconds, and the failure it guards
#                against is silent.
#
#   terms:       query.term — full text, including the detailed description and
#                arm labels. This is the ONLY axis that reaches basket trials.
#                NCT05405595 registers its condition as "Advanced/Metastatic
#                Solid Tumors" and says "with a focus on MSS CRC" only in its
#                detailed description; it is absent from all six condition
#                queries and is found by query.term="MSS colorectal" at rank 166
#                of 391. See the coverage note in trials/queries.py.
#
# Adding a query is safe — the union dedupes and the marginal-yield report will
# tell you whether it found anything new. If a new synonym adds zero trials,
# that is a measurement that the set is near-complete, and worth keeping.

sets:
  colorectal:
    label: Colorectal cancer
    conditions:
      - colorectal cancer
      - colorectal neoplasms
      - colon cancer
      - rectal cancer
      - bowel cancer
      - CRC
    terms:
      # Reaches solid-tumour basket trials that enrol CRC cohorts but never
      # register a colorectal condition. Narrow by construction (a few hundred
      # studies), so the false-positive cost is small and visible.
      - MSS colorectal
      - microsatellite stable colorectal
      - colorectal cohort

  # ---------------------------------------------------------------- ONCOLOGY
  nsclc:
    label: Non-small cell lung cancer
    conditions: [non-small cell lung cancer, lung adenocarcinoma, lung squamous cell carcinoma, NSCLC, carcinoma non-small-cell lung]
    terms: [NSCLC cohort, EGFR-mutant lung, ALK-positive lung]
  sclc:
    label: Small cell lung cancer
    # MEASURED 2026-08-07: the registry's tokeniser ignores the "non-" prefix, so
    # query.cond="small cell lung cancer" returns 9,604 studies of which 7 of the
    # first 8 are NON-small cell — the set would have been ~90% wrong population.
    # The Essie NOT operator separates them: 1,154 studies, 0 of 20 sampled
    # contaminated. This is the only set that needs an exclusion, and it needs one
    # because of how the index tokenises, not because of clinical ambiguity.
    conditions:
      - '"small cell lung cancer" NOT "non-small cell"'
      - '"small cell lung carcinoma" NOT "non-small cell"'
    terms: [extensive-stage small cell lung]
  breast:
    label: Breast cancer
    conditions: [breast cancer, breast neoplasms, triple negative breast cancer, HER2-positive breast cancer, hormone receptor positive breast cancer]
    terms: [breast cancer cohort, TNBC, HR+/HER2- breast]
  prostate:
    label: Prostate cancer
    conditions: [prostate cancer, prostatic neoplasms, castration-resistant prostate cancer, metastatic hormone-sensitive prostate cancer]
    terms: [mCRPC, prostate cohort]
  pancreatic:
    label: Pancreatic cancer
    conditions: [pancreatic cancer, pancreatic neoplasms, pancreatic ductal adenocarcinoma, PDAC]
    terms: [pancreatic cohort, metastatic pancreatic adenocarcinoma]
  gastric:
    label: Gastric and gastroesophageal junction cancer
    conditions: [gastric cancer, stomach neoplasms, gastroesophageal junction adenocarcinoma, esophageal cancer, gastroesophageal cancer]
    terms: [gastric cohort, GEJ adenocarcinoma, CLDN18.2 gastric]
  hepatocellular:
    label: Hepatocellular carcinoma
    conditions: [hepatocellular carcinoma, liver cancer, carcinoma hepatocellular, HCC]
    terms: [HCC cohort, advanced hepatocellular]
  ovarian:
    label: Ovarian cancer
    conditions: [ovarian cancer, ovarian neoplasms, fallopian tube cancer, primary peritoneal cancer, high-grade serous ovarian carcinoma]
    terms: [ovarian cohort, platinum-resistant ovarian]
  endometrial:
    label: Endometrial cancer
    conditions: [endometrial cancer, endometrial neoplasms, uterine cancer, uterine corpus cancer]
    terms: [endometrial cohort, dMMR endometrial]
  urothelial:
    label: Urothelial and bladder cancer
    conditions: [urothelial carcinoma, bladder cancer, urinary bladder neoplasms, transitional cell carcinoma]
    terms: [urothelial cohort, muscle-invasive bladder]
  renal_cell:
    label: Renal cell carcinoma
    conditions: [renal cell carcinoma, kidney cancer, carcinoma renal cell, clear cell renal cell carcinoma]
    terms: [RCC cohort, advanced renal cell]
  melanoma:
    label: Melanoma
    conditions: [melanoma, skin melanoma, uveal melanoma, cutaneous melanoma]
    terms: [melanoma cohort, BRAF-mutant melanoma]
  head_neck:
    label: Head and neck cancer
    conditions: [head and neck cancer, head and neck squamous cell carcinoma, oropharyngeal cancer, laryngeal cancer]
    terms: [HNSCC, head and neck cohort]
  glioblastoma:
    label: Glioblastoma and glioma
    conditions: [glioblastoma, glioma, brain neoplasms, astrocytoma]
    terms: [GBM cohort, IDH-mutant glioma]
  multiple_myeloma:
    label: Multiple myeloma
    conditions: [multiple myeloma, plasma cell myeloma, smoldering multiple myeloma]
    terms: [myeloma cohort, relapsed refractory multiple myeloma]
  aml:
    label: Acute myeloid leukaemia
    conditions: [acute myeloid leukemia, leukemia myeloid acute, AML, myelodysplastic syndrome]
    terms: [AML cohort, FLT3-mutated AML]
  cll:
    label: Chronic lymphocytic leukaemia
    conditions: [chronic lymphocytic leukemia, small lymphocytic lymphoma, CLL]
    terms: [CLL cohort, relapsed refractory CLL]
  dlbcl:
    label: Diffuse large B-cell lymphoma
    conditions: [diffuse large B-cell lymphoma, B-cell lymphoma, DLBCL]   # removed: 'non-Hodgkin lymphoma' (6,640) is a parent of DLBCL
    terms: [DLBCL cohort, relapsed refractory large B-cell]

  # ---------------------------------------------------------------- METABOLIC
  obesity:
    label: Obesity
    conditions: [obesity, overweight, weight loss, obesity morbid]
    terms: [GLP-1 obesity]   # removed: 'weight management' returned 18,260 — more than the whole obesity condition set
  type2_diabetes:
    label: Type 2 diabetes
    conditions: [type 2 diabetes, diabetes mellitus type 2, T2DM]
    terms: [glycaemic control, HbA1c reduction]
  type1_diabetes:
    label: Type 1 diabetes
    conditions: [type 1 diabetes, diabetes mellitus type 1, T1DM]
    terms: [islet autoimmunity, closed loop insulin]
  mash:
    label: MASH / NASH
    conditions: [nonalcoholic steatohepatitis, metabolic dysfunction-associated steatohepatitis, nonalcoholic fatty liver disease, NASH]
    terms: [MASH fibrosis, hepatic steatosis trial]

  # ------------------------------------------------------------ CARDIOVASCULAR
  heart_failure:
    label: Heart failure
    conditions: [heart failure, heart failure reduced ejection fraction, heart failure preserved ejection fraction, cardiomyopathy]
    terms: [HFrEF, HFpEF]
  dyslipidaemia:
    label: Dyslipidaemia
    conditions: [dyslipidemia, hypercholesterolemia, hyperlipidemia, familial hypercholesterolemia]
    terms: [LDL lowering]   # removed: 'lipoprotein(a)' (6,189) exceeded the condition set
  atrial_fibrillation:
    label: Atrial fibrillation
    conditions: [atrial fibrillation, atrial flutter]   # removed: 'arrhythmia' (5,933) is a parent concept, not an AF synonym
    terms: [AF ablation, stroke prevention atrial fibrillation]
  attr_amyloidosis:
    label: ATTR amyloidosis
    conditions: [transthyretin amyloidosis, cardiac amyloidosis, amyloidosis, ATTR]
    terms: [transthyretin cardiomyopathy]   # 'hATTR' removed: it is the KEY of the dedicated hereditary set, and resolve_query_set matched it here first

  # ------------------------------------------------------------- RESPIRATORY
  asthma:
    label: Asthma
    conditions: [asthma, severe asthma, eosinophilic asthma]
    terms: [asthma exacerbation, type 2 inflammation asthma]
  copd:
    label: COPD
    conditions: [chronic obstructive pulmonary disease, emphysema, chronic bronchitis, COPD]
    terms: [COPD exacerbation]
  ipf:
    label: Idiopathic pulmonary fibrosis
    conditions: [idiopathic pulmonary fibrosis, pulmonary fibrosis]   # removed: 'interstitial lung disease' is a parent; 'pulmonary fibrosis' kept as near-synonym
    terms: [progressive fibrosing ILD, FVC decline]
  cystic_fibrosis:
    label: Cystic fibrosis
    conditions: [cystic fibrosis]
    terms: [CFTR modulator, F508del]

  # ------------------------------------------------------------------- RENAL
  chronic_kidney_disease:
    label: Chronic kidney disease
    conditions: [chronic kidney disease, renal insufficiency chronic, diabetic nephropathy, diabetic kidney disease]
    terms: [eGFR decline, albuminuria trial]
  iga_nephropathy:
    label: IgA nephropathy
    conditions: [IgA nephropathy, glomerulonephritis IGA, glomerulonephritis]
    terms: [IgAN proteinuria]

  # -------------------------------------------------------------- IMMUNOLOGY
  rheumatoid_arthritis:
    label: Rheumatoid arthritis
    conditions: [rheumatoid arthritis, arthritis rheumatoid]
    terms: [DMARD inadequate response, ACR20]
  psoriasis:
    label: Psoriasis
    conditions: [psoriasis, plaque psoriasis, psoriatic arthritis]
    terms: [PASI 75, moderate to severe plaque psoriasis]
  atopic_dermatitis:
    label: Atopic dermatitis
    conditions: [atopic dermatitis, eczema, dermatitis atopic]
    terms: [EASI 75, moderate to severe atopic dermatitis]
  crohns:
    label: Crohn's disease
    conditions: [Crohn disease, Crohn's disease, inflammatory bowel disease]
    terms: [CDAI remission, biologic-experienced Crohn]
  ulcerative_colitis:
    label: Ulcerative colitis
    conditions: [ulcerative colitis, colitis ulcerative]
    terms: [moderately to severely active ulcerative colitis]   # removed: 'Mayo score' (4,040) matches any trial using the instrument
  lupus:
    label: Systemic lupus erythematosus
    conditions: [systemic lupus erythematosus, lupus erythematosus systemic, lupus nephritis]
    terms: [SLEDAI, SLE flare]
  alopecia_areata:
    label: Alopecia areata
    conditions: [alopecia areata, alopecia]
    terms: [alopecia areata severity]   # removed: 'SALT score' (3,543) matches any trial using the instrument

  # --------------------------------------------------------------- NEUROLOGY
  alzheimers:
    label: Alzheimer's disease
    conditions: [Alzheimer disease, Alzheimer's disease, mild cognitive impairment]   # removed: 'dementia' (6,556) is a parent covering vascular/Lewy body/FTD
    terms: [amyloid PET, CDR-SB, early Alzheimer]
  parkinsons:
    label: Parkinson's disease
    conditions: [Parkinson disease, Parkinson's disease, parkinsonian disorders]
    terms: [MDS-UPDRS, levodopa-induced dyskinesia]
  als:
    label: Amyotrophic lateral sclerosis
    conditions: [amyotrophic lateral sclerosis, motor neuron disease, ALS]
    terms: [ALSFRS-R, SOD1 ALS]
  multiple_sclerosis:
    label: Multiple sclerosis
    conditions: [multiple sclerosis, relapsing remitting multiple sclerosis, progressive multiple sclerosis]
    terms: [EDSS, relapse rate multiple sclerosis]
  epilepsy:
    label: Epilepsy
    conditions: [epilepsy, seizures, epilepsies partial, Dravet syndrome, Lennox-Gastaut syndrome]
    terms: [seizure frequency, drug-resistant epilepsy]
  migraine:
    label: Migraine
    conditions: [migraine disorders, migraine, chronic migraine, cluster headache]
    terms: [monthly migraine days, CGRP]
  huntingtons:
    label: Huntington's disease
    conditions: [Huntington disease, Huntington's disease]
    terms: [CAG repeat, UHDRS]

  # -------------------------------------------------------------- PSYCHIATRY
  major_depression:
    label: Major depressive disorder
    conditions: [depressive disorder major, major depressive disorder, treatment-resistant depression]   # removed: 'depression' (12,667) reaches all depression contexts, not MDD
    terms: [MADRS, HAM-D, treatment resistant depression]
  schizophrenia:
    label: Schizophrenia
    conditions: [schizophrenia, schizoaffective disorder]   # removed: 'psychotic disorders' (4,524) is a parent
    terms: [PANSS, acute exacerbation schizophrenia]

  # ----------------------------------------------------------- OPHTHALMOLOGY
  wet_amd:
    label: Neovascular (wet) AMD
    conditions: [wet macular degeneration, neovascular age-related macular degeneration, macular degeneration, choroidal neovascularization]
    terms: [anti-VEGF injection, BCVA letters]
  geographic_atrophy:
    label: Geographic atrophy
    conditions: [geographic atrophy, dry macular degeneration, macular degeneration]
    terms: [GA lesion growth, complement inhibitor atrophy]
  diabetic_macular_oedema:
    label: Diabetic macular oedema
    conditions: [diabetic macular edema, macular edema, diabetic retinopathy]
    terms: [DME central subfield thickness]

  # ------------------------------------------------------------- INFECTIOUS
  hiv:
    label: HIV
    conditions: [HIV infections, HIV, acquired immunodeficiency syndrome]
    terms: [viral suppression HIV, antiretroviral naive]
  hepatitis_b:
    label: Hepatitis B
    conditions: [hepatitis B chronic, hepatitis B, hepatitis B virus]
    terms: [HBsAg loss, functional cure hepatitis B]
  rsv:
    label: Respiratory syncytial virus
    conditions: [respiratory syncytial virus infections, RSV, bronchiolitis]
    terms: [RSV vaccine, RSV lower respiratory tract]
  influenza:
    label: Influenza
    conditions: [influenza human, influenza, influenza vaccines]
    terms: [influenza vaccine efficacy]
  tuberculosis:
    label: Tuberculosis
    conditions: [tuberculosis, tuberculosis pulmonary, latent tuberculosis, multidrug-resistant tuberculosis]
    terms: [MDR-TB regimen, sputum culture conversion]

  # ------------------------------------------------------------ HAEMATOLOGY
  sickle_cell:
    label: Sickle cell disease
    conditions: [anemia sickle cell, sickle cell disease, sickle cell anemia]
    terms: [vaso-occlusive crisis, HbF induction]
  haemophilia_a:
    label: Haemophilia A
    conditions: [hemophilia A, factor VIII deficiency]
    terms: [annualised bleeding rate, factor VIII inhibitor]
  haemophilia_b:
    label: Haemophilia B
    conditions: [hemophilia B, factor IX deficiency, Christmas disease]
    terms: [factor IX gene therapy]
  beta_thalassaemia:
    label: Beta-thalassaemia
    conditions: [beta-thalassemia, thalassemia]
    terms: [transfusion-dependent thalassemia]

  # ----------------------------------------------------------- RARE GENETIC
  sma:
    label: Spinal muscular atrophy
    conditions: [muscular atrophy spinal, spinal muscular atrophy, SMA]
    terms: [SMN2 copy number, motor milestone SMA]
  duchenne:
    label: Duchenne muscular dystrophy
    conditions: [muscular dystrophy Duchenne, Duchenne muscular dystrophy, muscular dystrophies]
    terms: [exon skipping, dystrophin expression]
  fabry:
    label: Fabry disease
    conditions: [Fabry disease]
    terms: [alpha-galactosidase A, GLA variant]
  gaucher:
    label: Gaucher disease
    conditions: [Gaucher disease]
    terms: [glucocerebrosidase]
  pompe:
    label: Pompe disease
    conditions: [Pompe disease, glycogen storage disease type II]
    terms: [acid alpha-glucosidase, GAA deficiency]
  hattr:
    label: Hereditary ATTR amyloidosis
    conditions: [amyloid neuropathies familial, hereditary transthyretin amyloidosis, familial amyloid polyneuropathy]
    terms: [hATTR polyneuropathy, TTR variant]
  pku:
    label: Phenylketonuria
    conditions: [phenylketonurias, phenylketonuria, PKU]
    terms: [phenylalanine restricted diet]   # removed: 'blood phenylalanine' (975) exceeded the 202-study condition set
  rett:
    label: Rett syndrome
    conditions: [Rett syndrome]
    terms: [Rett syndrome cohort]   # removed: 'MECP2' (113) exceeded the condition set and matches gene-panel trials

  # ------------------------------------------------------- DEVICE/DIAGNOSTIC
  neonatal_jaundice:
    label: Neonatal jaundice
    conditions: [jaundice neonatal, hyperbilirubinemia neonatal, jaundice, neonatal hyperbilirubinemia]
    terms: [transcutaneous bilirubin]   # removed: 'phototherapy neonate' (1,258) far exceeded the 261-study condition set
  diabetic_retinopathy_screening:
    label: Diabetic retinopathy screening
    conditions: [diabetic retinopathy]   # removed: 'retinal diseases' (4,266) is a parent
    terms: [retinal screening algorithm, fundus photography screening, autonomous AI diabetic retinopathy]
  sepsis_detection:
    label: Sepsis detection
    conditions: [sepsis, septic shock]   # removed: SIRS (3,537) is a related but distinct syndrome
    terms: [early warning score sepsis, sepsis prediction algorithm]
  sleep_apnoea:
    label: Obstructive sleep apnoea
    conditions: [sleep apnea obstructive, sleep apnea syndromes, obstructive sleep apnea]
    terms: [apnea-hypopnea index, home sleep test]
  cardiac_arrhythmia_monitoring:
    label: Cardiac arrhythmia monitoring
    conditions: [arrhythmias cardiac, atrial fibrillation, tachycardia]
    terms: [ambulatory ECG monitoring, wearable arrhythmia detection]
